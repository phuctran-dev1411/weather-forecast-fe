<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dự Báo Thời Tiết Việt Nam 2026</title>
    <link rel="shortcut icon" href="icon.png" type="image/x-icon">
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="index.css" />
  </head>
  <body class="bg-light">
    <div class="container py-4">
      <div class="row justify-content-center mb-4">
        <div class="col-md-6 col-lg-4">
          <label for="province-select" class="form-label fw-bold text-secondary"
            >Chọn Tỉnh / Thành phố:</label
          >
          <select
            id="province-select"
            class="form-select form-select-lg shadow-sm border-primary"
          >
            <option value="" disabled selected>-- Chọn tỉnh thành --</option>
          </select>
          
        </div>
        <div class="col-md-6 col-lg-4 form-group">
            <label for="datetime-select" class="form-label fw-bold text-secondary">--Chọn thời gian--</label>
            <input type="date" id="datetime" class="form-control" name="datetime-select">
        </div>
      </div>

      <header class="mb-4 text-center">
        <h2 class="fw-bold text-primary">
          <i class="fa-solid fa-microchip me-2"></i>Dự Báo Thời Tiết
        </h2>
        <p class="text-muted">
          <i class="fa-solid fa-location-dot me-1"></i
          ><span id="province"></span>, Việt Nam
        </p>
      </header>
      <div class="row justify-content-center mb-4">
        <div class="col-lg-8">
          <div class="card target-card bg-primary text-white border-0 shadow">
            <div class="card-body p-4 text-center" id="target-section">
              <!-- Sẽ render bằng JS -->
              <div class="spinner-border text-light" role="status">
                <span class="visually-hidden">Loading...</span>
              </div>
            </div>
          </div>
        </div>
      </div>
      <h4 class="mb-3 text-secondary">
        <i class="fa-regular fa-calendar-days me-2"></i>Dự báo chi tiết 7 ngày
      </h4>
      <div class="card border-0 shadow-sm rounded-4 overflow-hidden mb-5">
        <div class="card-header bg-white p-3 border-0">
          <ul
            class="nav nav-pills nav-fill gap-2 flex-nowrap overflow-auto pb-2"
            id="weatherTabs"
            role="tablist"
          >
          </ul>
        </div>
        <div class="card-body p-0">
          <!-- Tab Contents -->
          <div class="tab-content" id="weatherTabContent">
          </div>
        </div>
      </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="index.js"></script>
  </body>
</html>
